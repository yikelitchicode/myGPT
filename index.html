<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myGPT</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #2a2a72, #121212 55%);
        color: #f5f7fb;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        width: min(680px, calc(100vw - 32px));
        padding: 40px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 24px;
        background: rgba(255,255,255,.06);
        backdrop-filter: blur(14px);
        box-shadow: 0 24px 80px rgba(0,0,0,.35);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.4rem, 7vw, 4.8rem);
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: rgba(245,247,251,.86);
        font-size: 1.05rem;
      }
      .badge {
        display: inline-block;
        margin-bottom: 16px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(255,255,255,.12);
        font-size: .9rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Deployed with Vercel</div>
      <h1>myGPT</h1>
      <p>這是一個剛建立好的 GitHub + Vercel 專案。之後你要接 chat UI、API、資料庫或網域，我可以直接在這個專案上繼續接。</p>
    </main>
  </body>
</html>
